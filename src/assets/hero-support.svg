<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Desk -->
  <rect x="100" y="400" width="600" height="20" fill="#34495e" rx="5"/>
  
  <!-- Monitor -->
  <rect x="250" y="200" width="300" height="200" fill="#2c3e50" rx="10"/>
  <rect x="265" y="215" width="270" height="150" fill="#3498db"/>
  
  <!-- Monitor stand -->
  <rect x="375" y="400" width="50" height="30" fill="#34495e" rx="5"/>
  
  <!-- Code lines on screen -->
  <rect x="280" y="230" width="120" height="8" fill="#2ecc71" rx="2"/>
  <rect x="280" y="250" width="180" height="8" fill="#2ecc71" rx="2"/>
  <rect x="280" y="270" width="150" height="8" fill="#2ecc71" rx="2"/>
  <rect x="280" y="290" width="200" height="8" fill="#e74c3c" rx="2"/>
  <rect x="280" y="310" width="160" height="8" fill="#2ecc71" rx="2"/>
  
  <!-- Keyboard -->
  <rect x="220" y="430" width="360" height="80" fill="#34495e" rx="8"/>
  <g fill="#7f8c8d">
    <rect x="240" y="450" width="30" height="20" rx="3"/>
    <rect x="280" y="450" width="30" height="20" rx="3"/>
    <rect x="320" y="450" width="30" height="20" rx="3"/>
    <rect x="360" y="450" width="30" height="20" rx="3"/>
    <rect x="400" y="450" width="30" height="20" rx="3"/>
    <rect x="440" y="450" width="30" height="20" rx="3"/>
    <rect x="480" y="450" width="30" height="20" rx="3"/>
    <rect x="520" y="450" width="30" height="20" rx="3"/>
  </g>
  
  <!-- Mouse -->
  <ellipse cx="620" cy="470" rx="25" ry="35" fill="#34495e"/>
  <line x1="620" y1="445" x2="620" y2="495" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- Headset -->
  <path d="M 150 250 Q 150 180 200 180 Q 250 180 250 250" stroke="#e74c3c" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="150" cy="260" r="25" fill="#e74c3c"/>
  <circle cx="250" cy="260" r="25" fill="#e74c3c"/>
  
  <!-- Tools icon -->
  <g transform="translate(650, 250)">
    <circle cx="0" cy="0" r="40" fill="#3498db" opacity="0.2"/>
    <path d="M -15 -10 L -15 10 L -5 10 L -5 -10 Z" fill="#3498db"/>
    <circle cx="-10" cy="-15" r="5" fill="#3498db"/>
    <path d="M 5 -15 L 15 -5 L 5 5 L -5 -5 Z" fill="#e74c3c"/>
  </g>
  
  <!-- Checkmark -->
  <g transform="translate(100, 150)">
    <circle cx="0" cy="0" r="35" fill="#2ecc71" opacity="0.2"/>
    <path d="M -15 0 L -5 10 L 15 -10" stroke="#2ecc71" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Lightning bolt (speed) -->
  <g transform="translate(700, 150)">
    <circle cx="0" cy="0" r="35" fill="#f39c12" opacity="0.2"/>
    <path d="M 5 -15 L -10 0 L 0 0 L -5 15 L 10 0 L 0 0 Z" fill="#f39c12"/>
  </g>
</svg>
